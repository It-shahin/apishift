openapi: 3.0.3
info:
  title: Orbit Projects API
  version: 2.0.0
paths:
  /projects:
    get:
      summary: List projects
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            maximum: 50
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Project created
  /health:
    get:
      summary: Check service health
      responses:
        '200':
          description: Service available
components:
  schemas:
    Project:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
