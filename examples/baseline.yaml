openapi: 3.0.3
info:
  title: Orbit Projects API
  version: 1.0.0
paths:
  /projects:
    get:
      summary: List projects
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Project created
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Delete a project
      responses:
        '204':
          description: Project deleted
components:
  schemas:
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
